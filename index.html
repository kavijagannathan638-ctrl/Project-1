```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello everyone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );

            overflow: hidden;
        }

        /* Background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.6;
        }

        .circle.one {
            width: 250px;
            height: 250px;
            background: #00c6ff;
            top: -80px;
            left: -80px;
        }

        .circle.two {
            width: 300px;
            height: 300px;
            background: #ff00cc;
            bottom: -120px;
            right: -100px;
        }

        /* Main card */
        .card {
            position: relative;
            width: 450px;
            padding: 50px 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);

            color: white;

            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #00f2fe,
                #4facfe,
                #ff00cc
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            color: #eeeeee;
            margin-bottom: 30px;
        }

        button {
            padding: 13px 30px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #00c6ff,
                #0072ff
            );

            color: white;
            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.5);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="card">

        <h1>Hii I am Kavi!!</h1>
        <h1>I Love Ice Cream😁</h1>

        <p>
            Welcome to my first fancy web page ✨
        </p>

        <button onclick="sayHello()">
            Click Me 🚀
        </button>

    </div>

    <script>
        function sayHello() {
            alert("Hello World! 👋 Welcome to my website!");
        }
    </script>

</body>
</html>
```
